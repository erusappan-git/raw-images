<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     data-stacking-context="true"
     aria-owns="root"
     width="16"
     height="16"
     viewBox="32 32 16 16">

  <g data-tag="div"
